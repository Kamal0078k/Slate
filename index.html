<html lang="en">

    <title>Slate</title>
  </head>
  <body>
    <div id="backdrop" hidden></div>
    <div id="backdrop-overlay" hidden></div>

      <nav id="activitybar"></nav>

    <div id="overlay-root"></div>
    <script type="module" src="/src/main.ts"></script>
